# 1. Cho phép vào H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 2. ÉP TÊN CỐ ĐỊNH (Quan trọng nhất)
# Thay vì để nó tự đẻ UUID, mình đặt tên là gis_db
spring.datasource.url=jdbc:h2:mem:gis_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# 3. TẮT TÍNH NĂNG TỰ ĐẺ TÊN NGẪU NHIÊN
spring.datasource.generate-unique-name=false
# Ép không cho đẻ tên ngẫu nhiên (UUID)

# Đặt tên cố định cho Database

# 4. JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Bật bảng điều khiển H2
spring.headers.frame-config.same-origin=true